<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #12110f; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #12110f; text-decoration: none; }
    a:hover { color: #5f5d59; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    textarea { font-family: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #12110f; outline-offset: 2px; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #12110f;">
  <dc-import name="AppBar" active="campaigns" go="{{ go }}" hint-size="1440px,64px"></dc-import>

  <div style="display: flex; flex-direction: column; gap: 28px; width: 720px; margin: 0 auto; padding-top: 64px;">
    <h1 style="font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.035em;">Nouvelle campagne</h1>
    <label for="nc-brief" style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #5f5d59;">Que vendez-vous, et à qui ?
      <textarea id="nc-brief" rows="3" placeholder="Ex. : je crée des sites web pour les restaurants autour de Lyon" style="box-sizing: border-box; padding: 16px 18px; border: 1.5px solid #12110f; border-radius: 12px; background: #ffffff; font-size: 20px; line-height: 1.45; color: #12110f; resize: none;"></textarea>
    </label>

    <sc-if value="{{ notParsed }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ analyse }}" style="align-self: flex-start; display: flex; align-items: center; height: 50px; padding: 0 24px; border: 0; border-radius: 10px; background: #12110f; color: #ffffff; font-size: 16px; font-weight: 600;">Analyser</button>
    </sc-if>

    <sc-if value="{{ parsed }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 22px;">
        <span style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #5f5d59;"><span style="width: 12px; height: 12px; background: #fdf156;"></span>L'agent a compris</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <sc-for list="{{ fields }}" as="f" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 72px; box-sizing: border-box; padding: 0 18px; border-radius: 12px; border: 1px solid #dfdeda;">
              <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 13px; color: #5f5d59;">{{ f.label }}</span>
                <span style="font-size: 17px; font-weight: 600;">{{ f.value }}</span>
              </div>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f5d59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 6px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #5f5d59;">50 crédits au maximum</span>
          <button onClick="{{ launch }}" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 26px; border: 0; border-radius: 10px; background: #12110f; color: #ffffff; font-size: 16px; font-weight: 600;">Lancer l'agent <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const parsed = !!(this.state && this.state.parsed);
    return {
      go: this.props.go,
      parsed,
      notParsed: !parsed,
      analyse: () => this.setState({ parsed: true }),
      launch: () => { if (this.props.go) this.props.go('progress'); },
      fields: [
        { label: 'Offre', value: 'Création de site web' },
        { label: 'Cible', value: 'Restaurants' },
        { label: 'Zone', value: 'Lyon · 15 km' },
        { label: 'Volume', value: '50 prospects' }
      ]
    };
  }
}
</script>
</body>
</html>
