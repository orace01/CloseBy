<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #12110f; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #12110f; text-decoration: none; }
    a:hover { color: #5f5d59; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid #12110f; outline-offset: 2px; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #12110f;">
  <header style="display: flex; align-items: center; height: 72px; flex-shrink: 0; padding: 0 56px;">
    <button onClick="{{ toLanding }}" style="border: 0; background: none; padding: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; color: #12110f;">Close<span style="background: linear-gradient(180deg, transparent 45%, #fdf156 45%, #fdf156 90%, transparent 90%); padding: 0 2px;">By</span></button>
  </header>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 72px;">
    <div style="display: flex; flex-direction: column; gap: 28px; width: 400px;">
      <h1 style="font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em;">{{ title }}</h1>

      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 22px;">
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <label for="auth-email" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600;">E-mail
              <input id="auth-email" type="email" placeholder="vous@entreprise.fr" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #12110f; border-radius: 10px; background: #ffffff; font-size: 16px; font-weight: 400; color: #12110f;">
            </label>
            <sc-if value="{{ showPassword }}" hint-placeholder-val="{{ true }}">
              <label for="auth-password" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600;">Mot de passe
                <input id="auth-password" type="password" placeholder="8 caractères minimum" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #12110f; border-radius: 10px; background: #ffffff; font-size: 16px; font-weight: 400; color: #12110f;">
              </label>
            </sc-if>
            <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ toReset }}" style="align-self: flex-start; border: 0; background: none; padding: 0; font-size: 14px; color: #5f5d59; text-decoration: underline; text-underline-offset: 3px;">Mot de passe oublié ?</button>
            </sc-if>
          </div>
          <button onClick="{{ submit }}" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 0; border-radius: 10px; background: #12110f; color: #ffffff; font-size: 16px; font-weight: 600;">{{ cta }}</button>
        </div>
      </sc-if>

      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-radius: 10px; background: #f0f0ee; font-size: 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#287c42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          <span>Lien envoyé. Vérifiez vos e-mails.</span>
        </div>
      </sc-if>

      <div style="display: flex; gap: 6px; font-size: 15px; color: #5f5d59;">
        <span>{{ switchText }}</span>
        <button onClick="{{ switchAction }}" style="border: 0; background: none; padding: 0; font-size: 15px; font-weight: 600; color: #12110f; text-decoration: underline; text-underline-offset: 3px;">{{ switchLabel }}</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const mode = st.mode || 'signup';
    const sent = !!st.sent;
    const go = (s) => () => { if (this.props.go) this.props.go(s); };
    const setMode = (m) => () => this.setState({ mode: m, sent: false });
    const copy = {
      signup: { title: 'Créer un compte', cta: 'Créer mon compte', switchText: 'Déjà inscrit ?', switchLabel: 'Connexion', switchTo: 'login' },
      login: { title: 'Connexion', cta: 'Se connecter', switchText: 'Pas encore de compte ?', switchLabel: 'Créer un compte', switchTo: 'signup' },
      reset: { title: 'Mot de passe oublié', cta: 'Envoyer le lien', switchText: '', switchLabel: 'Retour à la connexion', switchTo: 'login' }
    }[mode];
    const submit = () => {
      if (mode === 'reset') { this.setState({ sent: true }); return; }
      if (this.props.go) this.props.go(mode === 'signup' ? 'onboarding' : 'dashboard');
    };
    return {
      title: copy.title,
      cta: copy.cta,
      switchText: copy.switchText,
      switchLabel: copy.switchLabel,
      switchAction: setMode(copy.switchTo),
      toReset: setMode('reset'),
      toLanding: go('landing'),
      submit,
      showForm: !sent,
      showPassword: mode !== 'reset',
      isLogin: mode === 'login',
      sent
    };
  }
}
</script>
</body>
</html>
