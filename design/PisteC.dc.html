    <g><use href="#shop" x="266" y="36" color="#966b27"></use><text x="366" y="70" text-anchor="middle" font-family="'Young Serif', Georgia, serif" font-size="15" letter-spacing="2" fill="#deaf5c">BISTROT</text><path d="M366 30v18" stroke="#deaf5c" stroke-width="1.5"></path><rect x="324" y="4" width="84" height="26" rx="13" fill="#deaf5c"></rect><text x="366" y="22" text-anchor="middle" font-family="'Figtree', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#0b3627">CIBLÉ</text></g>
    <g opacity="0.45"><use href="#shop" x="502" y="36" color="#2d644e"></use><text x="602" y="70" text-anchor="middle" font-family="'Young Serif', Georgia, serif" font-size="15" letter-spacing="2" fill="#deaf5c">COIFFURE</text></g>
    <g><use href="#shop" x="738" y="36" color="#0f4232"></use><text x="838" y="70" text-anchor="middle" font-family="'Young Serif', Georgia, serif" font-size="15" letter-spacing="2" fill="#deaf5c">PIZZERIA</text><path d="M838 30v18" stroke="#deaf5c" stroke-width="1.5"></path><rect x="796" y="4" width="84" height="26" rx="13" fill="#deaf5c"></rect><text x="838" y="22" text-anchor="middle" font-family="'Figtree', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#0b3627">CIBLÉ</text></g>

    <g opacity="0.45"><use href="#shop" x="1210" y="36" color="#2d644e"></use><text x="1310" y="70" text-anchor="middle" font-family="'Young Serif', Georgia, serif" font-size="15" letter-spacing="2" fill="#deaf5c">GARAGE</text></g>
    <rect x="0" y="246" width="1440" height="24" fill="#0b3627"></rect>
