<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #12110f; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #12110f; text-decoration: none; }
    a:hover { color: #5f5d59; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow-x: hidden; overflow-y: auto; background: #ffffff;">
  <sc-if value="{{ is.landing }}" hint-placeholder-val="{{ true }}"><dc-import name="Landing" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.auth }}" hint-placeholder-val="{{ false }}"><dc-import name="Auth" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.onboarding }}" hint-placeholder-val="{{ false }}"><dc-import name="Onboarding" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.dashboard }}" hint-placeholder-val="{{ false }}"><dc-import name="Dashboard" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.newCampaign }}" hint-placeholder-val="{{ false }}"><dc-import name="NewCampaign" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.progress }}" hint-placeholder-val="{{ false }}"><dc-import name="Progress" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.prospects }}" hint-placeholder-val="{{ false }}"><dc-import name="Prospects" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.review }}" hint-placeholder-val="{{ false }}"><dc-import name="Review" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.prospect }}" hint-placeholder-val="{{ false }}"><dc-import name="ProspectDetail" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.campaigns }}" hint-placeholder-val="{{ false }}"><dc-import name="Campaigns" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.mailboxes }}" hint-placeholder-val="{{ false }}"><dc-import name="Mailboxes" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.credits }}" hint-placeholder-val="{{ false }}"><dc-import name="Credits" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.settings }}" hint-placeholder-val="{{ false }}"><dc-import name="Settings" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
  <sc-if value="{{ is.admin }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin" go="{{ go }}" hint-size="1440px,900px"></dc-import></sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const screen = (this.state && this.state.screen) || 'landing';
    const ids = ['landing', 'auth', 'onboarding', 'dashboard', 'newCampaign', 'progress', 'prospects', 'review', 'prospect', 'campaigns', 'mailboxes', 'credits', 'settings', 'admin'];
    const is = {};
    ids.forEach((id) => { is[id] = screen === id; });
    return { is, go: (next) => this.setState({ screen: next }) };
  }
}
</script>
</body>
</html>
