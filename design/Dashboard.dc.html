<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #12110f; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #12110f; text-decoration: none; }
    a:hover { color: #5f5d59; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #12110f; outline-offset: 2px; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #12110f;">
  <dc-import name="AppBar" active="dashboard" go="{{ go }}" hint-size="1440px,64px"></dc-import>

  <div style="display: flex; flex-direction: column; gap: 40px; width: 1040px; margin: 0 auto; padding-top: 56px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.035em;">Bonjour Camille</h1>
      <button onClick="{{ toNew }}" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border: 0; border-radius: 10px; background: #12110f; color: #ffffff; font-size: 16px; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle campagne</button>
    </div>

    <button onClick="{{ toReview }}" style="display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 28px; border: 0; border-radius: 12px; background: #f0f0ee; color: #12110f; text-align: left;">
      <span style="display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 600;"><span style="width: 14px; height: 14px; background: #fdf156; box-shadow: inset 0 0 0 1px #12110f;"></span>12 e-mails à relire</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600;">Relire <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span>
    </button>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #dfdeda; border-bottom: 1px solid #dfdeda;">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 28px 0;"><span style="font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">38</span><span style="font-size: 15px; color: #5f5d59;">prospects trouvés</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 28px 32px; border-left: 1px solid #dfdeda;"><span style="font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">8</span><span style="font-size: 15px; color: #5f5d59;">e-mails envoyés</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 28px 32px; border-left: 1px solid #dfdeda;"><span style="font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">2</span><span style="font-size: 15px; color: #5f5d59;">réponses</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="font-size: 20px; font-weight: 600;">Campagnes récentes</h2>
      <div style="display: flex; flex-direction: column;">
        <button onClick="{{ toReview }}" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 4px; border: 0; border-bottom: 1px solid #efeeea; background: none; color: #12110f; text-align: left;">
          <span style="font-size: 17px; font-weight: 600;">Restaurants autour de Lyon</span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5f5d59;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #287c42;"></span>En cours</span>
        </button>
        <button onClick="{{ toCampaigns }}" style="display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 4px; border: 0; border-bottom: 1px solid #efeeea; background: none; color: #12110f; text-align: left;">
          <span style="font-size: 17px; font-weight: 600;">Coiffeurs à Villeurbanne</span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5f5d59;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #b9b8b3;"></span>Terminée</span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = (s) => () => { if (this.props.go) this.props.go(s); };
    return { go: this.props.go, toNew: nav('newCampaign'), toReview: nav('review'), toCampaigns: nav('campaigns') };
  }
}
</script>
</body>
</html>
