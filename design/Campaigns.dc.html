<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #12110f; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #12110f; text-decoration: none; }
    a:hover { color: #5f5d59; }
    h1, h2, h3, p { margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #12110f; outline-offset: 2px; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 1440px; height: 900px; overflow: hidden; background: #ffffff; color: #12110f;">
  <dc-import name="AppBar" active="campaigns" go="{{ go }}" hint-size="1440px,64px"></dc-import>

  <div style="display: flex; flex-direction: column; gap: 32px; width: 1040px; margin: 0 auto; padding-top: 48px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.035em;">Campagnes</h1>
      <button onClick="{{ toNew }}" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border: 0; border-radius: 10px; background: #12110f; color: #ffffff; font-size: 16px; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle campagne</button>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid #dfdeda;">
      <sc-for list="{{ rows }}" as="c" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 24px; height: 92px; border-bottom: 1px solid #efeeea;">
          <button onClick="{{ c.open }}" style="flex: 1; display: flex; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; color: #12110f; text-align: left;">
            <span style="font-size: 19px; font-weight: 600;">{{ c.name }}</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #5f5d59;">{{ c.stats }}</span>
          </button>
          <span style="display: flex; align-items: center; gap: 8px; width: 110px; font-size: 14px; font-weight: 600; color: {{ c.statusColor }};"><span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: {{ c.dot }};"></span>{{ c.status }}</span>
          <div style="display: flex; justify-content: flex-end; width: 120px;">
            <sc-if value="{{ c.canToggle }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ c.toggle }}" style="width: 120px; height: 42px; border-radius: 8px; border: 1px solid #c9c8c3; background: #ffffff; color: #12110f; font-size: 14px; font-weight: 600;">{{ c.toggleLabel }}</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const paused = st.paused || { 0: false, 2: true };
    const nav = (s) => () => { if (this.props.go) this.props.go(s); };
    const data = [
      { name: 'Restaurants autour de Lyon', stats: '12 à relire · 8 envoyés · 2 réponses', done: false },
      { name: 'Coiffeurs à Villeurbanne', stats: '24 envoyés · 3 réponses', done: true },
      { name: 'Fleuristes de Lyon', stats: '6 à relire · 10 envoyés', done: false }
    ];
    const rows = data.map((c, i) => {
      const isPaused = !c.done && !!paused[i];
      return {
        name: c.name,
        stats: c.stats,
        open: nav('review'),
        status: c.done ? 'Terminée' : (isPaused ? 'En pause' : 'En cours'),
        statusColor: c.done || isPaused ? '#5f5d59' : '#287c42',
        dot: c.done ? '#b9b8b3' : (isPaused ? '#5f5d59' : '#287c42'),
        canToggle: !c.done,
        toggleLabel: isPaused ? 'Reprendre' : 'Pause',
        toggle: () => { const next = Object.assign({}, paused); next[i] = !isPaused; this.setState({ paused: next }); }
      };
    });
    return { go: this.props.go, toNew: nav('newCampaign'), rows };
  }
}
</script>
</body>
</html>
